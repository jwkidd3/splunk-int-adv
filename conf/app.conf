# The course app. Everything the class creates belongs here, and so does the
# course's own configuration: keeping it out of etc/system/local means this
# course cannot collide with anything else installed on the same instance.
#
# That is not hypothetical. A sibling course on a shared training container
# defines its own products_lookup against different data; app scoping is what
# stops the two shadowing each other.

[install]
state = enabled
is_configured = true

[ui]
is_visible = true
label = CLASS: Intermediate

[launcher]
author = Harborview Outfitters course
description = Splunk Intermediate/Advanced course data, lookups and field extractions
version = 1.0.0
