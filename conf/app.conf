# The course app. Everything the class creates belongs here, and so does the
# course's own configuration: keeping it out of etc/system/local means this
# course cannot collide with anything else installed on the same instance.
#
# That is not hypothetical. The Fundamentals course defines a products_lookup
# against different data, and students often reuse the same instance. App
# scoping is one guard; the hv_ prefix on every lookup this course creates is
# the other, because the two product catalogues share column names and
# overlapping Code values, so a collision returns wrong names rather than
# failing.

[install]
state = enabled
is_configured = true

[ui]
is_visible = true
label = CLASS: Intermediate

[launcher]
author = Harborview Outfitters course
description = Splunk Intermediate/Advanced course data, lookups and field extractions
version = 1.0.0
