# Lookup definitions for the course.
#
# Installed by tools/load_data.sh alongside conf/props.conf. The LOOKUP-
# stanzas in props.conf are what make these *automatic*, which is what the
# labs assume: Labs 2, 3, 4, 5, 10 and 12 all reference fields that only
# exist because of them.

[products_lookup]
filename = products.csv

[vendors_lookup]
filename = vendors.csv

# Lab 12 wires this into a data model by hand, so it is defined but not
# applied automatically.
[http_status_lookup]
filename = http_status.csv
