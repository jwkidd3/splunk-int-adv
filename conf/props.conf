# Search-time properties for the course sourcetypes.
#
# Installed into the class app by tools/load_data.sh before students arrive.
#
# This file holds only what students cannot reasonably build themselves.
#
# Two kinds of setting live here, and the difference matters. TIME_PREFIX,
# TIME_FORMAT, TZ, MAX_TIMESTAMP_LOOKAHEAD and SHOULD_LINEMERGE are applied
# as data is indexed and written into the index; they have to be right before
# the first event lands, because nothing but a reload fixes them. EXTRACT-,
# EVAL- and KV_MODE are search-time and could be added at any point - they
# are here only because a stock Splunk does not ship them.
#
# Everything students build themselves - the indexes, the data, the lookups -
# is Lab 1 and is not configured here.
#
# One stanza per sourcetype. Splunk will merge repeated stanza names within a
# file, but relying on that makes the file hard to read and easy to break.

# ---------------------------------------------------------------------------
# Authentication logs.
#
# A stock Splunk recognises this sourcetype but ships none of its field
# extractions - those live in the Splunk Add-on for Unix and Linux, which is a
# Splunkbase download and so unavailable in an offline classroom. The EXTRACT-
# stanzas below cover the three line shapes this course's data contains.
# Without them `src_ip`, `user` and `vendor_action` resolve to nothing and
# seven of the twelve labs quietly return no results.
# ---------------------------------------------------------------------------
[linux_secure]
# Syslog lines carry no timezone. The generator writes them in UTC; without
# this Splunk would read them in the indexer's local timezone instead.
TZ = UTC
# Nov 01 19:44:21 www3 sshd[19620]: Accepted password for gbenali from 217.233.43.165 port 35020 ssh2
EXTRACT-ssh_result = sshd\[\d+\]:\s+(?<vendor_action>Accepted|Failed)\s+\w+\s+for\s+(?:invalid user\s+)?(?<user>[\w.\-]+)\s+from\s+(?<src_ip>[\d.]+)\s+port\s+(?<src_port>\d+)
# Oct 11 12:49:10 www1 sshd[20698]: pam_unix(sshd:session): session opened for user caraw by (uid=0)
EXTRACT-ssh_session = session opened for user\s+(?<user>[\w.\-]+)
# Oct 14 08:02:11 www2 sudo: gbenali : TTY=pts/3 ; PWD=/home ; USER=root ; COMMAND=/usr/bin/vi
EXTRACT-sudo_actor = sudo:\s+(?<user>[\w.\-]+)\s+:\s+TTY=
# Normalised outcome, so Module 14's CIM discussion has something real to show.
EVAL-action = case(vendor_action=="Accepted", "success", vendor_action=="Failed", "failure")
EVAL-app = "ssh"

# ---------------------------------------------------------------------------
# Retail vendor transactions. key=value pairs extract on their own, so the
# only index-time concern is the timestamp.
# ---------------------------------------------------------------------------
[vendor_sales]
TIME_PREFIX = \[
TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z

# ---------------------------------------------------------------------------
# The three JSON sources are newline-delimited, so Splunk breaks them into
# events on its own. KV_MODE is what turns each line's keys into fields.
# ---------------------------------------------------------------------------
[sales_entries]
KV_MODE = json
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 30

[web_proxy]
KV_MODE = json
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 30

[firewall]
KV_MODE = json
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 30

# ---------------------------------------------------------------------------
# Deliberately bare. Lab 8 is where students build these extractions, so
# anything here would remove the point of the exercise.
# ---------------------------------------------------------------------------
[trailmate_beta]
SHOULD_LINEMERGE = false
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 30
