# The automatic lookups, as configuration.
#
# Students build these through the UI in Lab 1, so this file is NOT part of
# the normal class setup. It exists so an instructor can reach a fully loaded
# instance in one command - for validating the course before class, or for
# rescuing a student whose lookups went wrong.
#
#   tools/load_data.sh --with-data
#
# The contents mirror exactly what Lab 1 has students create, so a student who
# follows the lab ends up with an equivalent configuration in their own app.
#
# Splunk expects these in two files. The loader splits them on the marker
# below rather than making you maintain two copies.

# ---- transforms.conf ----
[hv_products_lookup]
filename = hv_products.csv

[hv_vendors_lookup]
filename = hv_vendors.csv

[hv_http_status_lookup]
filename = hv_http_status.csv

# ---- props.conf ----
[access_combined]
LOOKUP-products = hv_products_lookup productId OUTPUT product_name categoryId price

[vendor_sales]
LOOKUP-products_by_code = hv_products_lookup Code OUTPUT product_name categoryId price
LOOKUP-vendors = hv_vendors_lookup VendorID OUTPUT Vendor VendorCity VendorStateProvince VendorCountry Weight

[sales_entries]
LOOKUP-products = hv_products_lookup productId OUTPUT product_name categoryId
